<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/css/stylesHome.css">
</head>
<body>

<h1>Home Page</h1>

<!-- Logged OUT -->
<p th:if="${user == null}" class="logged-out">
    Logged out
</p>

<!-- Logged IN -->
<p th:if="${user != null}" class="logged-in">
    Logged in as: <span th:text="${user.username}"></span>
</p>

<!-- 🔹 NAVIGATION (ONLY WHEN LOGGED IN) -->
<div th:if="${user != null}">
    <form action="/articles" method="get">
        <button type="submit">Articles</button>
    </form>
</div>

<br>

<form action="/login" method="get">
    <button type="submit">Login</button>
</form>
<form action="/logout" method="get">
    <button type="submit">Logout</button>
</form>

</body>
</html>
