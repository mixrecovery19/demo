<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0">

    <title>Wiki Home</title>

    <link rel="stylesheet"
          href="/css/stylesSidebar.css">

    <link rel="stylesheet"
          href="/css/stylesHome.css">
</head>

<body>

<div class="app-layout">

    <!-- 🔹 Reusable Sidebar -->
    <div th:replace="~{sidebar :: sidebar}">
    </div>

    <!-- 🔹 Main Content -->
    <main class="main-content">

        <h1>Welcome to My Wiki</h1>

        <p th:if="${user == null}"
           class="logged-out">

            You are currently browsing
            in read-only mode.
        </p>

        <p th:if="${user != null}"
           class="logged-in">

            Logged in as:
            <span th:text="${user.username}">
            </span>
        </p>

        <div class="hero-card">

            <h2>Knowledge Hub</h2>

            <p>
                Browse articles,
                explore content,
                and contribute
                after logging in.
            </p>

        </div>

    </main>

</div>

</body>
</html>
