<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/css/stylesHome.css">
</head>
<body th:class="${user != null} ? 'logged-in-bg' : 'logged-out-bg'">

<div class="container">

    <h1>Home Page</h1>

    <p th:if="${user == null}" class="logged-out">
        Logged out
    </p>

    <p th:if="${user != null}" class="logged-in">
        Logged in as: <span th:text="${user.username}"></span>
    </p>

    <!-- 🔹 Logged-in actions -->
    <div th:if="${user != null}" class="button-group">
        <form action="/articles" method="get">
            <button type="submit" class="btn-primary">View Articles</button>
        </form>
    </div>

    <!-- 🔹 Auth actions -->
    <div class="button-group">
        <form th:if="${user == null}" action="/login" method="get">
            <button type="submit" class="btn-secondary">Login</button>
        </form>

        <form th:if="${user != null}" action="/logout" method="get">
            <button type="submit" class="btn-danger">Logout</button>
        </form>
    </div>

</div>
</body>
</html>
